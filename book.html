<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro One Goalkeeping - Book</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
     <div class="page-wrapper">
    <header class="navbar">
      <a href="index.html" class="logo" id="logo-icon">
        <img src="assets/logo/logo.png" alt="Pro One Logo" />
      </a>
      <nav class="nav-icons">
        <div class="icon-card" id="video-icon">
          <img src="assets/icons/video.svg" alt="Videos Icon" />
          <span>Videos</span>
        </div>
        <div class="icon-card" id="coach-icon">
          <img src="assets/icons/user2.svg" alt="Coach Icon" />
          <span>Coach</span>
        </div>
        <div class="icon-card" id="services-icon">
          <img src="assets/icons/serv.svg" alt="Services Icon" />
          <span>Services</span>
        </div>
        <div class="icon-card" id="stadium-icon">
          <img src="assets/icons/stadium.svg" alt="Stadium Icon" />
          <span>Stadium</span>
        </div> 
        <div class="icon-card" id="testi-icon">
          <img src="assets/icons/testi.svg" alt="Testimonials Icon" />
          <span>Testimonials</span>
        </div>
        <div class="icon-card" id="contact-icon">
          <img src="assets/icons/phone.svg" alt="Contact Icon" />
          <span>Contact Us</span>
        </div>
        <div class="icon-card active-link" id="book-icon">
          <img src="assets/icons/bookk.svg" alt="book Icon" />
          <span>Book</span>
        </div>
        <div class="icon-card" id="theme-switch">
    <svg class="theme-switch-icon" id="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="var(--color-text)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <span>.</span>
  </div>

      </nav>
      
    </header>

    <section id="booking" class="section booking-page visible">
        <div class="booking-content-wrapper">
            <div class="booking-hero">
                <img src="assets/images/textt1.png" alt="Pro One Goalkeeping Academy" />
                <h2 class="section-title">Book Your <br> Elite Session</h2>
                <p>Ready to take the next step? Fill out the form to schedule a training session and we'll get back to you shortly.</p>
            </div>

            <div class="booking-form-container">
                 <h2 class="section-title">Appointment Form</h2>
                 <form id="appointment-form" action="https://api.web3forms.com/submit" method="POST">
                      <input type="hidden" name="access_key" value="30b061ac-cef1-472c-91e1-04b18174b218">

                    <input type="text" name="_gotcha" style="display:none" />

                    <input type="hidden" name="_subject" value="New Booking from Pro One Site" />
                    
                    <input type="hidden" name="_captcha" value="false">
                    
                    <input type="hidden" name="_next" value="index.html?submit=success">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="Name" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="Email" required placeholder="you@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="service">Select Service</label>
                        <div class="select-wrapper">   
                        <select id="service" name="Service" required>
                            <option value="" disabled selected>Choose a Service to Book</option>
                            <option value="Trial Training">Trial Training</option>
                            <option value="Training">Training</option>
                            <option value="Analysis">Analysis</option>
                            <option value="Scouting">Scouting</option>
                            <option value="Game Planning">Game Planning</option>
                            <option value="Online Coaching">Online Coaching</option>
                            <option value="Video Call">Video Call</option>
                        </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth (Optional)</label>
                        <input type="text" id="dob" name="Date of Birth" placeholder="e.g., 2005-10-25">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="Message" rows="5" required placeholder="Tell us about your goalkeeping experience..."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-button">SENT</button>
                </form>
            </div>
        </div>
    </section>
    
    <script src="js/script.js"></script>
  </body>
</html>
